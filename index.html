<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Expense Tracker</title>

<!--
=====================  SUPABASE SQL (run once in SQL Editor)  =====================

create table if not exists expenses (
  id bigint generated always as identity primary key,
  date date not null,
  period text not null check (period in ('morning','afternoon','night')),
  amount numeric not null default 0,
  unique (date, period)
);

alter table expenses enable row level security;

create policy "anon full access" on expenses
  for all to anon using (true) with check (true);

====================================================================================
-->

<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#1d2030;--muted:#7a8096;--accent:#5b5ef4;--line:#e6e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c1f2b;--text:#eef0f7;--muted:#8d93aa;--line:#2b2f3f}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:480px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0;font-size:1.6rem}
.sub{margin:4px 0 20px;color:var(--muted)}
h2{font-size:1rem;margin:12px 0 8px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.date-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--muted)}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.slot{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.slot input{width:130px;text-align:right}
input:focus{outline:2px solid var(--accent)}
.total,.month{display:flex;justify-content:space-between;margin:16px 0 12px;color:var(--muted)}
.total strong,.month strong{color:var(--text);font-size:1.2rem}
button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:1.2em;text-align:center;font-size:.9rem;color:var(--muted);margin:10px 0 0}
.day{border-top:1px solid var(--line);padding:10px 0;cursor:pointer}
.day-head{display:flex;justify-content:space-between;font-weight:600}
.day-detail{font-size:.85rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Expense Tracker</h1>
  <p class="sub">Morning · Afternoon · Night</p>

  <section class="card">
    <label class="date-row">Date
      <input type="date" id="date">
    </label>

    <div class="slot"><span>🌅 Morning</span><input type="number" id="morning" placeholder="0" min="0" step="any" inputmode="decimal"></div>
    <div class="slot"><span>☀️ Afternoon</span><input type="number" id="afternoon" placeholder="0" min="0" step="any" inputmode="decimal"></div>
    <div class="slot"><span>🌙 Night</span><input type="number" id="night" placeholder="0" min="0" step="any" inputmode="decimal"></div>

    <div class="total">Day total <strong id="dayTotal">0</strong></div>
    <button id="save">Save</button>
    <p id="msg"></p>
  </section>

  <section class="card">
    <div class="month">This month <strong id="monthTotal">0</strong></div>
    <h2>History</h2>
    <div id="history"></div>
  </section>
</main>

<script>
// ====== CONFIG: paste your Supabase details here ======
const SUPABASE_URL = "lxqcjyatgpxvdkywuzgi";      // e.g. https://xxxx.supabase.co
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4cWNqeWF0Z3B4dmRreXd1emdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzg1MjUsImV4cCI6MjEwNjk1NDUyNX0.eev_3ghRovNvr4rvx-0Mt7Wo17C-en3AuYn0M4h7DQQ"; // anon / public key
// ======================================================

const TABLE = "expenses";
const PERIODS = ["morning", "afternoon", "night"];
const $ = id => document.getElementById(id);
const headers = {
  apikey: SUPABASE_KEY,
  Authorization: "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};
const fmt = n => Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
const today = () => new Date().toLocaleDateString("en-CA");

let rows = [];

function setMsg(t, err) { $("msg").textContent = t; $("msg").style.color = err ? "#e5484d" : ""; }

function updateDayTotal() {
  $("dayTotal").textContent = fmt(PERIODS.reduce((s, p) => s + (parseFloat($(p).value) || 0), 0));
}

function fillInputs() {
  const d = $("date").value;
  PERIODS.forEach(p => {
    const r = rows.find(x => x.date === d && x.period === p);
    $(p).value = r ? r.amount : "";
  });
  updateDayTotal();
}

async function load() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=date.desc&limit=500`, { headers });
    if (!res.ok) throw new Error(await res.text());
    rows = await res.json();
    fillInputs();
    render();
    setMsg("");
  } catch (e) {
    setMsg("Could not load data. Check your Supabase URL/key.", true);
    console.error(e);
  }
}

async function save() {
  const d = $("date").value;
  if (!d) return setMsg("Pick a date", true);
  const payload = PERIODS
    .filter(p => $(p).value !== "")
    .map(p => ({ date: d, period: p, amount: parseFloat($(p).value) }));
  if (!payload.length) return setMsg("Enter at least one amount", true);

  $("save").disabled = true;
  setMsg("Saving…");
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?on_conflict=date,period`, {
      method: "POST",
      headers: { ...headers, Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    await load();
    setMsg("Saved ✓");
  } catch (e) {
    setMsg("Save failed. Check your table and policies.", true);
    console.error(e);
  } finally {
    $("save").disabled = false;
  }
}

function render() {
  const byDate = {};
  rows.forEach(r => (byDate[r.date] ||= {})[r.period] = Number(r.amount));

  const month = today().slice(0, 7);
  $("monthTotal").textContent = fmt(rows.filter(r => r.date.startsWith(month)).reduce((s, r) => s + Number(r.amount), 0));

  const dates = Object.keys(byDate).sort().reverse();
  $("history").innerHTML = dates.length ? dates.map(d => {
    const o = byDate[d];
    const total = PERIODS.reduce((s, p) => s + (o[p] || 0), 0);
    return `<div class="day" data-date="${d}">
      <div class="day-head"><span>${d}</span><span>${fmt(total)}</span></div>
      <div class="day-detail">Morning ${fmt(o.morning)} · Afternoon ${fmt(o.afternoon)} · Night ${fmt(o.night)}</div>
    </div>`;
  }).join("") : '<p class="empty">No entries yet.</p>';
}

$("date").value = today();
$("date").addEventListener("change", fillInputs);
PERIODS.forEach(p => $(p).addEventListener("input", updateDayTotal));
$("save").addEventListener("click", save);
$("history").addEventListener("click", e => {
  const day = e.target.closest(".day");
  if (day) { $("date").value = day.dataset.date; fillInputs(); window.scrollTo({ top: 0, behavior: "smooth" }); }
});

load();
</script>
</body>
</html>
